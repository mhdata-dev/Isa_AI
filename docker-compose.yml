# Ambiente separado da instalação da VPS. Não é um arquivo de migração.
name: isa-development

networks:
  internal:
    internal: true
  edge: {}

volumes:
  mira_data:
  calendar_data:

services:
  litellm:
    image: ghcr.io/berriai/litellm@sha256:41d9be75c624d7cfcc9123b74db0f2fbf4a1a3a2a658cf1b27e21a144f8e59ab
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "127.0.0.1:${LITELLM_HTTP_PORT:-14000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/drop_prompt_cache.py:/app/.venv/lib/python3.13/site-packages/drop_prompt_cache.py:ro
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mira:
    build:
      context: ./vendor/mira
    image: isa-mira:development
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "127.0.0.1:${ISA_HTTP_PORT:-18080}:8080"
    volumes:
      - mira_data:/data
    env_file: .env
    depends_on:
      litellm:
        condition: service_healthy

  mcp-calendar:
    build:
      context: ./services/mcp-calendar
    image: isa-mcp-calendar:development
    restart: unless-stopped
    networks: [internal, edge]
    volumes:
      - calendar_data:/data
    env_file: ./services/mcp-calendar/.env
